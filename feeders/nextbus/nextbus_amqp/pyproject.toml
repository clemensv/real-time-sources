[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "nextbus-amqp"
dynamic = ["version"]
description = "AMQP companion feeder for Nextbus"
requires-python = ">=3.10"
# WORKAROUND(xregistry/codegen#714): Proton 0.41.1 corrupts AMQP properties and body.
dependencies = [
    "python-qpid-proton>=0.40.0,<0.41.0",
    "nextbus_core",
    "requests>=2.32.3",
]

[project.scripts]
nextbus-amqp = "nextbus_amqp.app:main"

[tool.setuptools_scm]
root = "../../.."
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.setuptools.packages.find]
include = ["nextbus_amqp*"]
