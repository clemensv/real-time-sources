[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "usgs-waterdata-mqtt"
dynamic = ["version"]
description = "Native USGS Water Data MQTT 5 CloudEvents publisher"
requires-python = ">=3.10,<4.0"
dependencies = ["usgs-waterdata", "paho-mqtt>=2.1", "azure-identity>=1.17", "usgs-waterdata-mqtt-producer-data", "usgs-waterdata-mqtt-producer-mqtt-client"]

[tool.setuptools_scm]
root = "../../.."
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.setuptools]
packages = ["usgs_waterdata_mqtt"]
